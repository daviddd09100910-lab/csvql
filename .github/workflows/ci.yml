name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Run CTest
        run: ctest --test-dir build --output-on-failure -C Release

      - name: Smoke test demo CLI (Unix)
        if: runner.os != 'Windows'
        run: ./build/csvql_demo --demo --ascii --no-color

      - name: Smoke test demo CLI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\build\Release\csvql_demo.exe --demo --ascii --no-color
